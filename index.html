<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
        body { background-color: #0e0a03; color: #FFDC78; font-family: 'Press Start 2P', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; }
    </style>
</head>
<body>
  <h2>Загрузка...</h2>
  <script>
    setTimeout(() => {
        const params = new URLSearchParams(window.location.search);
        const tg = params.get('tg');
        if (window.location.pathname.endsWith('index.html') || window.location.pathname === '/') {
            window.location.href = tg ? `menu.html?tg=${encodeURIComponent(tg)}` : 'menu.html';
        }
    }, 500); // 500ms delay to allow telegram ready() to settle preventing loop
  </script>
</body>
</html>
