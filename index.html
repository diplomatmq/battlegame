<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }

        body {
            background: #0e0a03;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            color: #c8a040;
            overflow: hidden;
            position: relative;
        }

        /* Scanline overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.08) 2px,
                rgba(0,0,0,0.08) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        /* Particle background canvas */
        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 360px;
            background: #160e02;
            border: 4px solid #c8a040;
            box-shadow:
                0 0 0 2px #0e0a03,
                0 0 0 5px #6b4010,
                0 0 60px rgba(200,160,64,0.15);
            padding: 28px 24px 24px;
        }

        /* Pixel corner cuts */
        .container::before {
            content: '';
            position: absolute;
            inset: -4px;
            border: 4px solid #c8a040;
            clip-path: polygon(
                12px 0%, calc(100% - 12px) 0%,
                100% 12px, 100% calc(100% - 12px),
                calc(100% - 12px) 100%, 12px 100%,
                0% calc(100% - 12px), 0% 12px
            );
            pointer-events: none;
        }

        .title {
            text-align: center;
            font-size: 22px;
            color: #f0c040;
            text-shadow: 3px 3px 0 #5a2000, 0 0 25px rgba(240,192,64,0.6);
            margin-bottom: 4px;
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            font-size: 7px;
            color: #6b4810;
            margin-bottom: 24px;
            letter-spacing: 4px;
        }

        .divider {
            border: none;
            border-top: 2px solid #3a2008;
            margin: 16px 0;
        }

        /* ─── Avatar ─────────────────────────────────── */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .avatar-wrap {
            position: relative;
            cursor: pointer;
        }

        .avatar-frame {
            width: 84px;
            height: 84px;
            border: 4px solid #c8a040;
            box-shadow: 0 0 0 2px #6b4010, 0 0 20px rgba(200,160,64,0.3);
            background: #0e0a03;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }

        .avatar-wrap:hover .avatar-frame {
            box-shadow: 0 0 0 2px #6b4010, 0 0 30px rgba(200,160,64,0.6);
        }

        .avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-edit-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            background: #c8a040;
            color: #0e0a03;
            font-size: 8px;
            padding: 3px 5px;
            line-height: 1;
        }

        .avatar-label {
            font-size: 6px;
            color: #4a3008;
            margin-top: 7px;
            letter-spacing: 2px;
        }

        /* ─── Fields ──────────────────────────────────── */
        .field { margin-bottom: 14px; }

        .field label {
            display: block;
            font-size: 7px;
            color: #8b6020;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        .field input[type="text"] {
            width: 100%;
            background: #0e0a03;
            border: 3px solid #3a2008;
            color: #f0c040;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 9px 10px;
            outline: none;
            transition: border-color 0.2s;
            caret-color: #c8a040;
        }

        .field input[type="text"]:focus { border-color: #c8a040; }
        .field input[type="text"].error  { border-color: #ff5555; }
        .field input[type="text"].ok     { border-color: #44ff88; }

        .nick-row { display: flex; gap: 8px; }
        .nick-row input { flex: 1; }

        .btn-check {
            background: #160e02;
            border: 3px solid #3a2008;
            color: #8b6020;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 0 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-check:hover { border-color: #c8a040; color: #c8a040; }

        .nick-status {
            font-size: 6px;
            margin-top: 5px;
            min-height: 12px;
            letter-spacing: 1px;
        }

        .nick-status.taken { color: #ff5555; }
        .nick-status.free  { color: #44ff88; }

        /* ─── OK Button ───────────────────────────────── */
        .btn-ok {
            width: 100%;
            margin-top: 6px;
            background: #c8a040;
            border: none;
            color: #0e0a03;
            font-family: 'Press Start 2P', monospace;
            font-size: 13px;
            padding: 13px;
            cursor: pointer;
            letter-spacing: 4px;
            box-shadow: 5px 5px 0 #6b4010;
            transition: transform 0.08s, box-shadow 0.08s, opacity 0.2s;
        }

        .btn-ok:not(:disabled):hover  { transform: translate(-1px,-1px); box-shadow: 6px 6px 0 #6b4010; }
        .btn-ok:not(:disabled):active { transform: translate(4px,4px);   box-shadow: 1px 1px 0 #6b4010; }
        .btn-ok:disabled { opacity: 0.35; cursor: not-allowed; }

        #avatarFileInput { display: none; }

        /* ─── Flash overlay ───────────────────────────── */
        #flash {
            position: fixed;
            inset: 0;
            background: #f0c040;
            opacity: 0;
            pointer-events: none;
            z-index: 998;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>
  <script>
    // Immediately forward to menu — registration UI removed.
    // Menu will auto-register using Telegram WebApp data or ?tg=<id> param.
    const params = new URLSearchParams(window.location.search);
    const tg = params.get('tg');
    const target = tg ? `menu.html?tg=${encodeURIComponent(tg)}` : 'menu.html';
    location.replace(target);
  </script>
</body>
</html>
