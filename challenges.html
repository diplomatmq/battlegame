<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Челленджи</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(145deg, #0a0e1a 0%, #0d1a2e 50%, #0a1220 100%);
            min-height: 100vh; width: 100vw;
            font-family: 'Inter', sans-serif;
            color: #e0e8ff;
            overflow-x: hidden; position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -10%;
            width: 120%; height: 70%;
            background: radial-gradient(ellipse at 50% 50%, rgba(0,229,255,0.05) 0%, transparent 60%),
                        radial-gradient(ellipse at 30% 70%, rgba(96,200,240,0.04) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; }

        .page { position: relative; z-index: 2; padding: 0 0 40px; max-width: 520px; margin: 0 auto; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .back-btn {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: rgba(255,255,255,0.5);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .back-btn:hover {
            border-color: rgba(0,229,255,0.3);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,229,255,0.1);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff, #60c8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .coins { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #ffd700; }

        /* Sections */
        .section-title {
            padding: 20px 18px 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            letter-spacing: 4px;
        }

        /* Challenge card */
        .challenge-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            margin: 0 14px 12px;
            padding: 16px 18px;
            position: relative;
            transition: all 0.3s;
        }
        .challenge-card:hover {
            border-color: rgba(0,229,255,0.15);
            box-shadow: 0 4px 20px rgba(0,229,255,0.05);
        }
        .challenge-card.done {
            border-color: rgba(0,204,102,0.2);
            opacity: 0.7;
        }

        .ch-top { display: flex; align-items: flex-start; gap: 14px; }

        .ch-icon { font-size: 28px; line-height: 1; flex-shrink: 0; }

        .ch-info { flex: 1; }
        .ch-name {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.5;
        }
        .ch-desc {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            line-height: 1.6;
            font-weight: 500;
        }

        .ch-reward {
            font-size: 11px;
            font-weight: 700;
            color: #ffd700;
            white-space: nowrap;
        }

        /* Progress bar */
        .ch-progress { margin-top: 12px; }
        .progress-track {
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.08);
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00b8d4, #00e5ff);
            border-radius: 2px;
            transition: width 0.4s;
            box-shadow: 0 0 8px rgba(0,229,255,0.3);
        }
        .progress-fill.done {
            background: linear-gradient(90deg, #00aa55, #00cc66);
            box-shadow: 0 0 8px rgba(0,204,102,0.3);
        }
        .progress-label {
            font-size: 9px;
            color: rgba(255,255,255,0.3);
            margin-top: 4px;
            text-align: right;
            font-weight: 500;
        }

        .done-badge {
            position: absolute; top: 12px; right: 12px;
            font-size: 9px;
            font-weight: 700;
            color: #00cc66;
            background: rgba(0,204,102,0.1);
            border: 1px solid rgba(0,204,102,0.3);
            border-radius: 8px;
            padding: 4px 10px;
        }

        /* Claim button */
        .claim-btn {
            position: absolute; bottom: 14px; right: 14px;
            background: rgba(0,204,102,0.1);
            border: 1px solid rgba(0,204,102,0.3);
            border-radius: 10px;
            color: #00cc66;
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 700;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .claim-btn:hover { background: rgba(0,204,102,0.2); box-shadow: 0 0 16px rgba(0,204,102,0.1); }
        .claim-btn:disabled { opacity: 0.3; cursor: default; }

        /* Timer badge */
        .timer-badge {
            font-size: 9px;
            font-weight: 500;
            color: rgba(255,255,255,0.3);
            position: absolute; top: 12px; right: 12px;
        }

        #flash { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 998; transition: opacity 0.25s; }
        #toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0,229,255,0.3);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            padding: 12px 24px;
            box-shadow: 0 8px 32px rgba(0,229,255,0.1);
            z-index: 200; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; white-space: nowrap;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="page">
        <div class="header">
            <button class="back-btn" onclick="window.location.replace('menu.html')">◀ НАЗАД</button>
            <div class="title">🏆 ЧЕЛЛЕНДЖИ</div>
            <div class="coins">🪙 <span id="coinCount">0</span></div>
        </div>

        <div class="section-title">📅 ЕЖЕДНЕВНЫЕ</div>
        <div id="dailyList"></div>

        <div class="section-title">📆 ЕЖЕНЕДЕЛЬНЫЕ</div>
        <div id="weeklyList"></div>
    </div>

    <div id="toast"></div>
    <div id="flash"></div>
    <script type="module" src="dist/challenges.js"></script>
</body>
</html>
