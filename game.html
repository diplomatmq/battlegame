<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Бой</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { image-rendering: pixelated; box-sizing: border-box; }
        body { 
            margin: 0; background-color: #0e0a03; color: #c8a040; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; font-family: 'Press Start 2P', monospace; 
            overflow: hidden;
        }
        /* Scanlines */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
            );
            pointer-events: none;
            z-index: 999;
        }
        #game-wrapper { 
            position: relative; width: min(900px, 95vw); height: min(600px, 95vh); 
            background: linear-gradient(180deg, #100c02 0%, #0a0800 100%); 
            border: 4px solid #3a2008;
            box-shadow: 0 0 0 2px #0e0a03, 0 0 50px rgba(200,160,64,0.1);
            overflow: hidden; 
        }
        .ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; 
            display: flex; justify-content: space-between; 
            padding: 16px 24px; box-sizing: border-box; z-index: 10;
        }
        .player-ui { display: flex; align-items: center; gap: 12px; }
        .player-ui.right { flex-direction: row-reverse; }
        .avatar { 
            width: 52px; height: 52px;
            background: #160e02; border: 3px solid #c8a040; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 10px; overflow: hidden;
            box-shadow: 0 0 14px rgba(200,160,64,0.3);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .info { display: flex; flex-direction: column; gap: 6px; }
        .name { font-size: 9px; color: #f0c040; letter-spacing: 1px; text-shadow: 0 0 8px rgba(240,192,64,0.5); }
        .hp-bar-bg { 
            width: 220px; height: 14px; background: #160e02; 
            border: 2px solid #3a2008; overflow: hidden; 
        }
        .hp-bar-fill { 
            height: 100%; width: 100%; transition: width 0.1s ease-out; 
            box-shadow: inset 0 0 8px rgba(255,255,255,0.2);
        }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .controls { 
            position: absolute; bottom: 12px; width: 100%; 
            text-align: center; color: #3a2008; font-size: 7px; letter-spacing: 3px;
            z-index: 10;
        }
        #backBtn {
            display: none;
            position: absolute;
            bottom: 34px; left: 50%; transform: translateX(-50%);
            z-index: 20;
            background: #c8a040;
            border: none;
            color: #0e0a03;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 10px 24px;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 4px 4px 0 #6b4010;
        }
        #backBtn:hover { background: #f0c040; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div class="ui-layer">
            <div class="player-ui left">
                <div class="avatar" id="p1Avatar" style="border-color: #00e5ff;">P1</div>
                <div class="info">
                    <div class="name" id="p1Name">КРИО-РЫЦАРЬ</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-fill-1" style="background: #00e5ff;"></div></div>
                </div>
            </div>
            <div class="player-ui right">
                <div class="avatar" id="p2Avatar" style="border-color: #cc3300;">P2</div>
                <div class="info">
                    <div class="name" id="p2Name" style="text-align: right;">\u0412\u0420\u0410\u0413</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-fill-2" style="background: #cc3300; float: right;"></div></div>
                </div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div class="controls">▌ АВТОМАТИЧЕСКИЙ БОЙ ▐</div>
        <button id="backBtn" onclick="window.location.href='menu.html'">◀ В МЕНЮ</button>
    </div>
    <script type="module" src="dist/game.js"></script>
</body>
</html>
