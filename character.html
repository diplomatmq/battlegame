<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Выбор героя</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Inter', sans-serif;
            color: #e0e8ff;
            overflow: hidden;
            padding: 0;
            position: relative;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dynamic background layer */
        #bgOverlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.15;
            background: radial-gradient(circle at 50% 50%, var(--char-color, #ba55ff) 0%, transparent 70%);
            transition: background 0.8s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -20%;
            width: 140%; height: 80%;
            background: radial-gradient(ellipse at 30% 50%, rgba(186,85,255,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 40%, rgba(0,229,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; }

        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-top: 40px;
            pointer-events: none;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 6px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 4px;
            font-weight: 600;
        }

        /* ─── Carousel Layout ────────────────────────── */
        .cards-viewport {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 0 50%; /* Center the items */
            z-index: 5;
        }
        .cards-viewport::-webkit-scrollbar { display: none; }

        .cards-inner {
            display: flex;
            gap: 40px;
            padding-right: 50vw; /* balance the initial padding */
        }

        .char-card {
            width: 75vw;
            max-width: 320px;
            height: 60vh;
            max-height: 520px;
            scroll-snap-align: center;
            flex-shrink: 0;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            opacity: 0.2;
            transform: scale(0.8);
            position: relative;
        }

        .char-card.active {
            opacity: 1;
            transform: scale(1.05);
            border-color: var(--char-color, #ba55ff);
            box-shadow: 0 0 80px rgba(var(--char-rgb), 0.2);
            background: rgba(255,255,255,0.05);
        }

        .char-card canvas {
            width: 130% !important;
            height: auto !important;
            max-height: 300px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
            margin-bottom: 20px;
        }

        .char-info-box {
            text-align: center;
            transition: transform 0.4s;
        }

        .char-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .char-stats {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Confirm button */
        .btn-confirm {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: var(--char-color, #ba55ff);
            border: none;
            border-radius: 24px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            padding: 20px 70px;
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 15px 40px rgba(var(--char-rgb), 0.4);
            text-transform: uppercase;
        }

        .btn-confirm:hover {
            transform: translateX(-50%) translateY(-5px) scale(1.05);
            box-shadow: 0 20px 50px rgba(var(--char-rgb), 0.5);
            background: #fff;
        }
        .btn-confirm:active { transform: translateX(-50%) translateY(0); }
        .btn-confirm:disabled {
            opacity: 0.1;
            filter: grayscale(1);
            cursor: not-allowed;
            transform: translateX(-50%) !important;
        }

        #flash {
            position: fixed; inset: 0;
            background: #000; opacity: 0;
            pointer-events: none; z-index: 998;
            transition: opacity 0.25s;
        }
    </style>
</head>
<body>
    <div id="bgOverlay"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="header">
        <h1>BATTLE REALM</h1>
        <p>ВЫБЕРИ СВОЕГО ГЕРОЯ</p>
    </div>

    <!-- Carousel Viewport -->
    <div class="cards-viewport" id="cardsViewport">
        <div class="cards-inner" id="cardsContainer"></div>
    </div>

    <button class="btn-confirm" id="btnConfirm" disabled onclick="confirmSelect()">
        ▶ ВЫБРАТЬ
    </button>

    <div id="flash"></div>
    <script type="module" src="dist/character.js?v=20260320-v3"></script>
</body>
</html>
