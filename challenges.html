<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Челленджи</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }

        body {
            background: #030a14;
            min-height: 100vh; width: 100vw;
            font-family: 'Press Start 2P', monospace;
            color: #40a8c8;
            overflow-x: hidden; position: relative;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
            pointer-events: none; z-index: 999;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; }

        .page { position: relative; z-index: 2; padding: 0 0 40px; max-width: 520px; margin: 0 auto; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px 10px; border-bottom: 3px solid #0a2030;
        }

        .back-btn {
            background: #020810; border: 3px solid #0a2030;
            color: #1a4050; font-family: 'Press Start 2P', monospace;
            font-size: 9px; padding: 8px 12px; cursor: pointer;
            box-shadow: 3px 3px 0 #010508; transition: all 0.12s;
        }
        .back-btn:hover { border-color: #40a8c8; color: #40a8c8; transform: translateY(-1px); }
        .back-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #010508; }

        .title { font-size: 12px; color: #60c8f0; text-shadow: 3px 3px 0 #003050; letter-spacing: 3px; }

        .coins { display: flex; align-items: center; gap: 6px; font-size: 9px; color: #f0e040; }

        /* Sections */
        .section-title { padding: 18px 18px 8px; font-size: 7px; color: #1a4050; letter-spacing: 3px; }

        /* Challenge card */
        .challenge-card {
            background: #020810; border: 3px solid #0a2030;
            box-shadow: 4px 4px 0 #010508;
            margin: 0 14px 12px; padding: 14px 16px; position: relative;
        }
        .challenge-card.done { border-color: #006633; opacity: 0.7; }

        .ch-top { display: flex; align-items: flex-start; gap: 12px; }

        .ch-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }

        .ch-info { flex: 1; }
        .ch-name { font-size: 7px; color: #60c8f0; margin-bottom: 5px; line-height: 1.6; }
        .ch-desc { font-size: 5px; color: #1a4050; line-height: 1.8; }

        .ch-reward { font-size: 6px; color: #f0e040; white-space: nowrap; }

        /* Progress bar */
        .ch-progress { margin-top: 10px; }
        .progress-track {
            height: 8px; background: #0a1020; border: 2px solid #0a2030;
            position: relative; overflow: hidden;
        }
        .progress-fill { height: 100%; background: #2080b0; transition: width 0.4s; }
        .progress-fill.done { background: #00aa55; }
        .progress-label { font-size: 5px; color: #1a4050; margin-top: 4px; text-align: right; }

        .done-badge {
            position: absolute; top: 10px; right: 10px;
            font-size: 5px; color: #00cc66; background: #001a0a;
            border: 2px solid #00cc66; padding: 3px 7px;
        }

        /* Claim button */
        .claim-btn {
            position: absolute; bottom: 12px; right: 12px;
            background: #003020; border: 2px solid #00aa55;
            color: #00cc66; font-family: 'Press Start 2P', monospace;
            font-size: 6px; padding: 6px 14px; cursor: pointer;
            box-shadow: 2px 2px 0 #010508; transition: all 0.12s;
        }
        .claim-btn:hover { background: #00aa55; color: #000; }
        .claim-btn:active { transform: translate(2px,2px); box-shadow: none; }
        .claim-btn:disabled { opacity: 0.4; cursor: default; }

        /* Timer badge */
        .timer-badge { font-size: 5px; color: #1a4050; position: absolute; top: 10px; right: 10px; }

        #flash { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 998; transition: opacity 0.25s; }
        #toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: #020810; border: 3px solid #40a8c8;
            color: #60c8f0; font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 10px 18px; box-shadow: 4px 4px 0 #010508;
            z-index: 200; opacity: 0; transition: opacity 0.2s;
            pointer-events: none; white-space: nowrap;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="page">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='menu.html'">◀ НАЗАД</button>
            <div class="title">🏆 ЧЕЛЛЕНДЖИ</div>
            <div class="coins">🪙 <span id="coinCount">0</span></div>
        </div>

        <div class="section-title">📅 ЕЖЕДНЕВНЫЕ</div>
        <div id="dailyList"></div>

        <div class="section-title">📆 ЕЖЕНЕДЕЛЬНЫЕ</div>
        <div id="weeklyList"></div>
    </div>

    <div id="toast"></div>
    <div id="flash"></div>
    <script type="module" src="dist/challenges.js"></script>
</body>
</html>
