<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест кнопки</title>
    <style>
        body {
            margin: 0;
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        #container {
            position: relative;
            width: 600px;
            height: 400px;
            background: #1a1e2a;
            border-radius: 20px;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
        
        #backBtn {
            display: none;
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 40px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            pointer-events: auto;
        }
        
        #backBtn:hover {
            background: linear-gradient(135deg, #7c8ef5 0%, #8a5bb5 100%);
            transform: translateX(-50%) translateY(-2px);
        }
        
        #testBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="container">
        <button id="testBtn">Симулировать окончание боя</button>
        <canvas id="testCanvas" width="600" height="400"></canvas>
        <button id="backBtn" onclick="alert('Кнопка работает!')">ВЕРНУТЬСЯ В МЕНЮ</button>
    </div>

    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const backBtn = document.getElementById('backBtn');
        const testBtn = document.getElementById('testBtn');
        
        let gameOver = false;
        
        function drawGameOver() {
            // Clear canvas
            ctx.fillStyle = "#0a0e1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Dark overlay
            ctx.fillStyle = "rgba(0,0,0,0.9)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Winner name
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 30;
            ctx.shadowColor = "#00e5ff";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 48px Arial, sans-serif";
            ctx.fillText("ИГРОК123", canvas.width / 2, canvas.height / 2 - 80);
            
            // "ПОБЕДИТЕЛЬ"
            ctx.shadowBlur = 0;
            ctx.font = "bold 28px Arial, sans-serif";
            ctx.fillStyle = "#00e5ff";
            ctx.fillText("ПОБЕДИТЕЛЬ", canvas.width / 2, canvas.height / 2 - 20);
            
            // Hint
            ctx.font = "16px Arial, sans-serif";
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fillText("Нажмите кнопку ниже для возврата в меню", canvas.width / 2, canvas.height / 2 + 60);
        }
        
        function showBackButton() {
            console.log("Showing back button...");
            backBtn.style.display = "block";
            backBtn.style.opacity = "1";
            backBtn.style.visibility = "visible";
            backBtn.style.zIndex = "10000";
            backBtn.style.position = "fixed";
            backBtn.style.bottom = "60px";
            backBtn.style.left = "50%";
            backBtn.style.transform = "translateX(-50%)";
            backBtn.style.pointerEvents = "auto";
            console.log("Button element:", backBtn);
            console.log("Button styles:", window.getComputedStyle(backBtn).display);
        }
        
        testBtn.addEventListener('click', () => {
            console.log("Simulating game over...");
            gameOver = true;
            drawGameOver();
            showBackButton();
            
            // Retry showing button
            setTimeout(showBackButton, 100);
            setTimeout(showBackButton, 500);
        });
        
        // Initial draw
        ctx.fillStyle = "#1a1e2a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "20px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Нажмите кнопку 'Симулировать окончание боя'", canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
