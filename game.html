<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Бой</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: linear-gradient(145deg, #0a0e1a 0%, #141a2e 50%, #0d1220 100%);
            color: #e0e8ff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: min(900px, 100vw);
            height: min(600px, 100dvh);
            background: linear-gradient(180deg, rgba(10,14,26,0.95) 0%, rgba(13,18,32,0.98) 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            box-shadow: 0 0 60px rgba(0,229,255,0.05), inset 0 0 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between;
            padding: 16px 20px; box-sizing: border-box; z-index: 10;
        }

        .player-ui {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 8px 14px;
        }
        .player-ui.right { flex-direction: row-reverse; }

        .avatar {
            width: 46px; height: 46px;
            background: rgba(0,229,255,0.06);
            border: 2px solid rgba(0,229,255,0.4);
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 12px; font-weight: 700; overflow: hidden;
            box-shadow: 0 0 12px rgba(0,229,255,0.1);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

        .info { display: flex; flex-direction: column; gap: 6px; }

        .name {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .hp-bar-bg {
            width: 180px; height: 12px;
            background: rgba(255,255,255,0.06);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%; width: 100%;
            border-radius: 5px;
            transition: width 0.15s ease-out;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2), 0 0 8px currentColor;
        }

        canvas {
            display: block; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            border-radius: 20px;
        }

        .controls {
            position: absolute; bottom: 14px; width: 100%;
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.15);
            z-index: 10;
        }

        #backBtn {
            display: none;
            position: absolute;
            bottom: 40px; left: 50%; transform: translateX(-50%);
            z-index: 20;
            background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(186,85,255,0.15));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0,229,255,0.3);
            border-radius: 14px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            padding: 12px 28px;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 0 20px rgba(0,229,255,0.1);
            transition: all 0.3s;
        }
        #backBtn:hover {
            background: linear-gradient(135deg, rgba(0,229,255,0.25), rgba(186,85,255,0.25));
            box-shadow: 0 0 40px rgba(0,229,255,0.2);
        }

        @media (max-width: 780px) {
            #game-wrapper {
                width: 100vw;
                height: 100dvh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            canvas {
                border-radius: 0;
            }

            .ui-layer {
                padding: 8px 10px;
                gap: 6px;
            }

            .player-ui {
                flex: 1 1 0;
                min-width: 0;
                gap: 8px;
                padding: 6px 8px;
                border-radius: 10px;
            }

            .avatar {
                width: 34px;
                height: 34px;
                border-radius: 8px;
                font-size: 9px;
            }

            .name {
                font-size: 8px;
                letter-spacing: 0.4px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100px;
            }

            .hp-bar-bg {
                width: min(40vw, 112px);
                height: 9px;
            }

            .controls {
                bottom: 8px;
                font-size: 8px;
                letter-spacing: 2px;
            }

            #backBtn {
                bottom: 22px;
                font-size: 9px;
                padding: 9px 16px;
                letter-spacing: 2px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div class="ui-layer">
            <div class="player-ui left">
                <div class="avatar" id="p1Avatar" style="border-color: rgba(0,229,255,0.5);">P1</div>
                <div class="info">
                    <div class="name" id="p1Name">КРИО-РЫЦАРЬ</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-fill-1" style="background: linear-gradient(90deg, #00e5ff, #00b8d4); color: #00e5ff;"></div></div>
                </div>
            </div>
            <div class="player-ui right">
                <div class="avatar" id="p2Avatar" style="border-color: rgba(204,51,0,0.5);">P2</div>
                <div class="info">
                    <div class="name" id="p2Name" style="text-align: right;">ВРАГ</div>
                    <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-fill-2" style="background: linear-gradient(90deg, #cc3300, #ff4422); color: #cc3300; float: right;"></div></div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div class="controls" id="battleStatus">ПОИСК СОПЕРНИКА...</div>
        <button id="backBtn" onclick="window.location.replace('menu.html')">◀ В МЕНЮ</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script type="module" src="dist/game.js?v=20260320-v1"></script>
</body>
</html>
