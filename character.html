<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Выбор героя</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Inter', sans-serif;
            color: #e0e8ff;
            overflow: hidden;
            padding: 0;
            position: relative;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dynamic background layer */
        #bgOverlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.15;
            background: radial-gradient(circle at 50% 50%, var(--char-color, #ba55ff) 0%, transparent 70%);
            transition: background 0.8s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -20%;
            width: 140%; height: 80%;
            background: radial-gradient(ellipse at 30% 50%, rgba(186,85,255,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 40%, rgba(0,229,255,0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; }

        .header {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(135deg, #ba55ff 0%, #00e5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            filter: drop-shadow(0 0 20px rgba(186,85,255,0.3));
            margin-bottom: 8px;
        }

        .header p {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 3px;
            font-weight: 500;
        }

        /* ─── Cards row ───────────────────────────────── */
        .cards {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 600px;
        }

        .char-card {
            width: 160px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 14px;
            position: relative;
            overflow: hidden;
        }

        .char-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: radial-gradient(ellipse at 50% 0%, var(--glow-color, rgba(0,229,255,0.08)), transparent 70%);
            opacity: 0;
            transition: opacity 0.35s;
        }

        .char-card:hover {
            border-color: var(--char-color);
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(var(--char-rgb), 0.2);
        }
        .char-card:hover::before { opacity: 1; }

        .char-card.selected {
            border-color: var(--char-color) !important;
            box-shadow: 0 0 0 1px var(--char-color), 0 0 40px rgba(var(--char-rgb), 0.3) !important;
        }
        .char-card.selected::before { opacity: 1; }

        .char-card canvas {
            display: block;
            position: relative;
            z-index: 1;
        }

        .char-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .char-stats {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Confirm button */
        .btn-confirm {
            position: fixed;
            bottom: 40px;
            z-index: 20;
            background: var(--char-color, #ba55ff);
            border: none;
            border-radius: 20px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 900;
            padding: 18px 60px;
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(var(--char-rgb), 0.3);
            text-transform: uppercase;
        }

        .btn-confirm:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 40px rgba(var(--char-rgb), 0.4);
            background: #fff;
        }
        .btn-confirm:active { transform: translateY(0); }
        .btn-confirm:disabled {
            opacity: 0.3;
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none !important;
        }

        #flash {
            position: fixed; inset: 0;
            background: #000; opacity: 0;
            pointer-events: none; z-index: 998;
            transition: opacity 0.25s;
        }
    </style>
</head>
<body>
    <div id="bgOverlay"></div>
    <canvas id="bgCanvas"></canvas>

    <div class="header">
        <h1>BATTLE REALM</h1>
        <p>ВЫБЕРИ СВОЕГО ГЕРОЯ</p>
    </div>

    <!-- Carousel Viewport -->
    <div class="cards-viewport" id="cardsViewport">
        <div class="cards-inner" id="cardsContainer"></div>
    </div>

    <button class="btn-confirm" id="btnConfirm" disabled onclick="confirmSelect()">
        ▶ ВЫБРАТЬ
    </button>

    <div id="flash"></div>
    <script type="module" src="dist/character.js?v=20260320-v2"></script>
</body>
</html>
