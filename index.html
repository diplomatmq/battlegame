<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
  <!-- Данный фрейм нужен, чтобы переходы по страницам внутри игры не вызывали перезагрузку приложения в Telegram (бесконечный цикл) -->
  <iframe id="gameFrame" src="" allow="fullscreen"></iframe>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
    const params = new URLSearchParams(window.location.search);
    const tg = params.get('tg');
    const startPage = params.get('page') || 'menu.html';
    const url = tg ? `${startPage}?tg=${encodeURIComponent(tg)}` : startPage;
    console.log("Loading into iframe:", url);
    // Передаем window.location.hash внутрь фрейма, чтобы Telegram SDK инициализировался
    document.getElementById('gameFrame').src = url + window.location.hash;
  </script>
</body>
</html>
