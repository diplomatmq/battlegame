<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Главное меню</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(145deg, #0a0e1a 0%, #141a2e 50%, #0d1220 100%);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Inter', sans-serif;
            color: #e0e8ff;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -40%; left: -20%;
            width: 140%; height: 80%;
            background: radial-gradient(ellipse at 30% 50%, rgba(0,229,255,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 40%, rgba(186,85,255,0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; }

        /* ─── Top bar ───────────────────────────────── */
        .topbar {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 0;
        }

        .player-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 8px 14px;
        }

        .player-avatar {
            width: 42px;
            height: 42px;
            border: 2px solid rgba(0,229,255,0.6);
            border-radius: 12px;
            background: rgba(0,229,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 16px rgba(0,229,255,0.15);
        }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

        .player-info { display: flex; flex-direction: column; gap: 2px; }

        .player-nick {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .player-level {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            font-weight: 500;
            letter-spacing: 1px;
        }

        .coin-block {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
        }
        .coin-icon { font-size: 18px; }

        /* ─── Title ─────────────────────────────────── */
        .game-title {
            position: relative;
            z-index: 2;
            margin-top: 20px;
            text-align: center;
        }

        .game-title h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff 0%, #ba55ff 50%, #ff0055 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 6px;
            filter: drop-shadow(0 0 30px rgba(0,229,255,0.3));
        }

        .game-title .sub {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 6px;
            margin-top: 6px;
            font-weight: 500;
        }

        /* ─── Arena / Character area ─────────────────── */
        .arena-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            height: 300px;
            flex-shrink: 0;
        }

        #arenaCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ─── Bottom nav ─────────────────────────────── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;
            padding: 0 16px 20px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            color: rgba(255,255,255,0.5);
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            padding: 12px 14px;
        }

        .nav-btn:hover {
            border-color: rgba(0,229,255,0.3);
            color: #fff;
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(0,229,255,0.15);
            background: rgba(0,229,255,0.08);
        }

        .nav-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .nav-btn .icon  { font-size: 24px; }
        .nav-btn .label { font-size: 9px; letter-spacing: 2px; font-weight: 600; }

        /* Shop & Challenges — side buttons */
        .nav-btn.side {
            width: 100px;
            min-height: 72px;
        }

        /* Play — center, bigger */
        .nav-btn.play {
            width: 148px;
            min-height: 80px;
            border-color: rgba(0,229,255,0.3);
            color: #00e5ff;
            background: rgba(0,229,255,0.06);
            box-shadow: 0 0 24px rgba(0,229,255,0.1), inset 0 0 20px rgba(0,229,255,0.03);
        }

        .nav-btn.play .label {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .nav-btn.play:hover {
            background: rgba(0,229,255,0.15);
            border-color: rgba(0,229,255,0.5);
            color: #fff;
            box-shadow: 0 0 40px rgba(0,229,255,0.25), inset 0 0 30px rgba(0,229,255,0.06);
            transform: translateY(-6px) scale(1.02);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 24px rgba(0,229,255,0.1), inset 0 0 20px rgba(0,229,255,0.03); }
            50% { box-shadow: 0 0 36px rgba(0,229,255,0.2), inset 0 0 30px rgba(0,229,255,0.05); }
        }
        .nav-btn.play { animation: pulseGlow 3s ease-in-out infinite; }

        /* ─── Divider glow above nav ─────────────────── */
        .nav-line {
            position: fixed;
            bottom: 108px;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,229,255,0.2), rgba(186,85,255,0.2), transparent);
            z-index: 9;
        }

        #flash {
            position: fixed; inset: 0;
            background: #000; opacity: 0;
            pointer-events: none; z-index: 998;
            transition: opacity 0.25s;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <!-- Top bar -->
    <div class="topbar" id="topbar">
        <div class="player-badge">
            <div class="player-avatar" id="playerAvatar">⚔️</div>
            <div class="player-info">
                <div class="player-nick" id="playerNick">ГЕРОЙ</div>
                <div class="player-level">LVL 1</div>
            </div>
        </div>
        <div class="coin-block">
            <span class="coin-icon">🪙</span>
            <span id="coinCount">0</span>
        </div>
    </div>

    <!-- Title -->
    <div class="game-title">
        <h1>BATTLE REALM</h1>
        <div class="sub">ВЫБЕРИ БОЙ</div>
    </div>

    <!-- Character arena -->
    <div class="arena-wrap">
        <canvas id="arenaCanvas"></canvas>
    </div>

    <!-- Divider -->
    <div class="nav-line"></div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
        <button class="nav-btn side" onclick="goShop()">
            <div class="icon">🛒</div>
            <div class="label">МАГАЗИН</div>
        </button>

        <button class="nav-btn play" onclick="goPlay()">
            <div class="icon">⚔️</div>
            <div class="label">ИГРАТЬ</div>
        </button>

        <button class="nav-btn side" onclick="goChallenges()">
            <div class="icon">🏆</div>
            <div class="label">ЧЕЛЛЕНДЖИ</div>
        </button>
    </div>

    <div id="flash"></div>
    <script type="module" src="dist/menu.js?v=20260320-v1"></script>
</body>
</html>
