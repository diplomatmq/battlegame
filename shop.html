<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(145deg, #0a0e1a 0%, #141a2e 50%, #0d1220 100%);
            min-height: 100vh;
            width: 100vw;
            font-family: 'Inter', sans-serif;
            color: #e0e8ff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%; left: -10%;
            width: 120%; height: 70%;
            background: radial-gradient(ellipse at 40% 50%, rgba(255,215,0,0.04) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 30%, rgba(0,229,255,0.04) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; }

        .page { position: relative; z-index: 2; padding: 0 0 120px; max-width: 520px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .back-btn {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: rgba(255,255,255,0.5);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .back-btn:hover {
            border-color: rgba(0,229,255,0.3);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,229,255,0.1);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .coins {
            display: flex; align-items: center; gap: 8px;
            font-size: 14px; font-weight: 700; color: #ffd700;
        }

        /* Items grid */
        .section-title {
            padding: 18px 18px 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            letter-spacing: 4px;
        }

        .items-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; padding: 0 14px;
        }

        .shop-item {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center;
            padding: 16px 10px; gap: 10px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            position: relative;
        }
        .shop-item:hover {
            border-color: rgba(255,215,0,0.3);
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(255,215,0,0.08);
        }
        .shop-item.owned {
            border-color: rgba(0,204,102,0.2);
            cursor: default;
        }
        .shop-item.owned:hover { transform: none; box-shadow: none; }
        .shop-item.equipped {
            border-color: rgba(0,204,102,0.4);
            box-shadow: 0 0 20px rgba(0,204,102,0.1);
        }

        .item-icon { font-size: 32px; line-height: 1; }
        .item-name {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            text-align: center;
            line-height: 1.5;
        }
        .item-bonus {
            font-size: 9px;
            font-weight: 600;
            color: #00cc66;
            text-align: center;
            line-height: 1.6;
            min-height: 14px;
        }
        .item-price {
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #ffd700;
            padding: 6px 14px;
        }
        .equip-btn {
            background: rgba(0,204,102,0.08);
            border: 1px solid rgba(0,204,102,0.3);
            border-radius: 8px;
            color: #00cc66;
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            font-weight: 700;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .equip-btn:hover { background: rgba(0,204,102,0.2); }
        .equip-btn.is-equipped {
            background: rgba(255,68,68,0.08);
            border-color: rgba(255,68,68,0.3);
            color: #ff6666;
        }
        .equip-btn.is-equipped:hover { background: rgba(255,68,68,0.2); }

        /* Stats panel */
        .stats-bar {
            margin: 14px 14px 0;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 14px 18px;
        }
        .stats-row {
            display: flex; justify-content: space-between; align-items: center;
            gap: 10px; flex-wrap: wrap;
        }
        #playerLevel {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
        }
        .xp-track {
            flex: 1; height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.08);
            min-width: 60px;
            overflow: hidden;
        }
        #xpBar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #00e5ff, #ba55ff);
            border-radius: 3px;
            transition: width 0.3s;
        }
        #xpText { font-size: 9px; color: rgba(255,255,255,0.35); font-weight: 500; white-space: nowrap; }
        #statsPanel {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
            margin-top: 10px;
        }

        /* Toast */
        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0,229,255,0.3);
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            padding: 12px 24px;
            box-shadow: 0 8px 32px rgba(0,229,255,0.1);
            z-index: 200; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; white-space: nowrap;
        }

        #flash { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 998; transition: opacity 0.25s; }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="page">
        <div class="header">
            <button class="back-btn" onclick="window.location.replace('menu.html')">◀ НАЗАД</button>
            <div class="title">🛒 МАГАЗИН</div>
            <div class="coins">🪙 <span id="coinCount">0</span></div>
        </div>

        <div class="stats-bar">
            <div class="stats-row">
                <div id="playerLevel">LVL 1</div>
                <div class="xp-track"><div id="xpBar"></div></div>
                <div id="xpText">0 / 15 XP</div>
            </div>
            <div id="statsPanel">⚔️ ATK 1 &nbsp; 🛡️ DEF 1 &nbsp; 💨 SPD 1</div>
        </div>

        <div class="section-title">⚔️ ОРУЖИЕ</div>
        <div class="items-grid" id="weaponsGrid"></div>

        <div class="section-title">🛡️ БРОНЯ</div>
        <div class="items-grid" id="armorsGrid"></div>

        <div class="section-title">💍 АКСЕССУАРЫ</div>
        <div class="items-grid" id="accessoriesGrid"></div>
    </div>

    <div id="toast"></div>
    <div id="flash"></div>
    <script type="module" src="dist/shop.js"></script>
</body>
</html>
