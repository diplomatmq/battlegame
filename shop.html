<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Realm — Магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }

        body {
            background: #0a0308;
            min-height: 100vh;
            width: 100vw;
            font-family: 'Press Start 2P', monospace;
            color: #c8a040;
            overflow-x: hidden;
            position: relative;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
            pointer-events: none; z-index: 999;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; }

        .page { position: relative; z-index: 2; padding: 0 0 120px; max-width: 520px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 18px 10px;
            border-bottom: 3px solid #3a2008;
        }

        .back-btn {
            background: #160e02; border: 3px solid #3a2008;
            color: #6b4810; font-family: 'Press Start 2P', monospace;
            font-size: 9px; padding: 8px 12px; cursor: pointer;
            box-shadow: 3px 3px 0 #0e0a03; transition: all 0.12s;
        }
        .back-btn:hover { border-color: #c8a040; color: #c8a040; transform: translateY(-1px); }
        .back-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #0e0a03; }

        .title { font-size: 14px; color: #f0c040; text-shadow: 3px 3px 0 #5a2000; letter-spacing: 3px; }

        .coins { display: flex; align-items: center; gap: 6px; font-size: 9px; color: #f0c040; }

        /* Items grid */
        .section-title { padding: 16px 18px 8px; font-size: 8px; color: #6b4810; letter-spacing: 3px; }

        .items-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; padding: 0 14px;
        }

        .shop-item {
            background: #130a01; border: 3px solid #3a2008;
            box-shadow: 4px 4px 0 #0a0500;
            display: flex; flex-direction: column; align-items: center;
            padding: 14px 10px; gap: 10px; cursor: pointer;
            transition: all 0.12s; position: relative;
        }
        .shop-item:hover { border-color: #c8a040; transform: translateY(-2px); box-shadow: 4px 6px 0 #0a0500; }
        .shop-item:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 #0a0500; }
        .shop-item.owned { border-color: #1a4020; cursor: default; }
        .shop-item.owned:hover { transform: none; box-shadow: 4px 4px 0 #0a0500; }
        .shop-item.equipped { border-color: #00cc66; box-shadow: 4px 4px 0 #0a0500, 0 0 14px rgba(0,204,102,0.4); }

        .item-icon { font-size: 30px; line-height: 1; }
        .item-name { font-size: 6px; color: #c8a040; text-align: center; line-height: 1.6; letter-spacing: 1px; }
        .item-bonus { font-size: 5px; color: #00cc66; text-align: center; line-height: 1.8; min-height: 12px; }
        .item-price {
            background: #0e0a03; border: 2px solid #6b4810;
            font-size: 7px; color: #f0c040; padding: 4px 10px;
        }
        .equip-btn {
            background: #001a0a; border: 2px solid #00aa55;
            color: #00cc66; font-family: 'Press Start 2P', monospace;
            font-size: 5px; padding: 5px 10px; cursor: pointer;
            box-shadow: 2px 2px 0 #010508; transition: all 0.1s;
        }
        .equip-btn:hover { background: #00aa55; color: #000; }
        .equip-btn.is-equipped { background: #003a10; border-color: #ff4444; color: #ff6666; }
        .equip-btn.is-equipped:hover { background: #ff4444; color: #fff; }

        /* Stats panel */
        .stats-bar {
            margin: 12px 14px 0;
            background: #0d0800; border: 3px solid #3a2008;
            padding: 10px 14px;
        }
        .stats-row {
            display: flex; justify-content: space-between; align-items: center;
            gap: 8px; flex-wrap: wrap;
        }
        #playerLevel { font-size: 7px; color: #f0c040; white-space: nowrap; }
        .xp-track {
            flex: 1; height: 8px; background: #130a01;
            border: 2px solid #3a2008;
            min-width: 60px;
        }
        #xpBar { height: 100%; width: 0%; background: #c8a040; transition: width 0.3s; }
        #xpText { font-size: 5px; color: #6b4810; white-space: nowrap; }
        #statsPanel { font-size: 6px; color: #c8a040; letter-spacing: 1px; margin-top: 8px; }

        /* Toast */
        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: #160e02; border: 3px solid #c8a040;
            color: #f0c040; font-family: 'Press Start 2P', monospace;
            font-size: 7px; padding: 10px 18px;
            box-shadow: 4px 4px 0 #0e0a03;
            z-index: 200; opacity: 0; transition: opacity 0.2s;
            pointer-events: none; white-space: nowrap;
        }

        #flash { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 998; transition: opacity 0.25s; }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="page">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='menu.html'">◀ НАЗАД</button>
            <div class="title">🛒 МАГАЗИН</div>
            <div class="coins">🪙 <span id="coinCount">0</span></div>
        </div>

        <div class="stats-bar">
            <div class="stats-row">
                <div id="playerLevel">LVL 1</div>
                <div class="xp-track"><div id="xpBar"></div></div>
                <div id="xpText">0 / 15 XP</div>
            </div>
            <div id="statsPanel">⚔️ ATK 1 &nbsp; 🛡️ DEF 1 &nbsp; 💨 SPD 1</div>
        </div>

        <div class="section-title">⚔️ ОРУЖИЕ</div>
        <div class="items-grid" id="weaponsGrid"></div>

        <div class="section-title">🛡️ БРОНЯ</div>
        <div class="items-grid" id="armorsGrid"></div>

        <div class="section-title">💍 АКСЕССУАРЫ</div>
        <div class="items-grid" id="accessoriesGrid"></div>
    </div>

    <div id="toast"></div>
    <div id="flash"></div>
    <script type="module" src="dist/shop.js"></script>
</body>
</html>
